# Plataforma AWS em emulador (floci) a cada PR: sem conta AWS, sem segredo, sem custo.
# Prova que as 6 stacks Terraform aplicam e destroem limpo e que o GitOps renderiza.
name: platform-floci

on:
  pull_request:
    paths: ["platform/**", "repos/**", "gitops/**", "contracts/**", ".github/workflows/platform-floci.yml"]
  push:
    branches: [main]
    paths: ["platform/**", "repos/**", "gitops/**", "contracts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-floci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iac-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      floci:
        image: floci/floci:2.4.0
        ports: ["4566:4566"]
        volumes: ["/var/run/docker.sock:/var/run/docker.sock"]   # EKS (k3s) e ECR sobem containers reais
        env:
          FLOCI_SERVICES_ECR_URI_STYLE: path
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/4566'" --health-interval 5s --health-retries 30
    env:
      # contexto `runner` não existe no env do job (workflow seria rejeitado): caminho fixo do runner Linux
      LAB_CACHE_DIR: /tmp/lab-cache
      FLOCI_ENDPOINT: http://localhost.floci.io:4566
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # repos/enterprise-automation (módulos Terraform)

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive platform/terraform

      - name: GitOps renderiza (kustomize)
        run: |
          python gitops/gen.py
          git diff --exit-code gitops/apps gitops/overlays gitops/env || (echo "gitops/ desatualizado: rode python gitops/gen.py" && exit 1)
          kubectl kustomize gitops/overlays/floci > /dev/null

      - name: providers.tf sincronizado com _shared
        run: |
          python platform/lab.py sync
          git diff --exit-code platform/terraform || (echo "rode python platform/lab.py sync" && exit 1)

      - name: up (00 -> 05) no floci
        run: python platform/lab.py up --target floci

      - name: kubectl no EKS emulado
        run: |
          python platform/lab.py kubeconfig --target floci
          KUBECONFIG=platform/.kube/floci.yaml kubectl get nodes -o wide

      - name: diagnóstico do emulador (só em falha)
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          for c in $(docker ps -aq --filter ancestor=floci/floci:2.4.0); do echo "== floci $c"; docker logs --tail 200 "$c" 2>&1; done
          for c in $(docker ps -aq --filter name=k3s) $(docker ps -aq --filter ancestor=rancher/k3s); do echo "== k3s $c"; docker logs --tail 80 "$c" 2>&1; done

      - name: down (05 -> 00)
        if: always()
        run: python platform/lab.py down --target floci

      - name: o que segura a VPC (só se o down falhar)
        if: failure()
        run: |
          export AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 AWS_ENDPOINT_URL=$FLOCI_ENDPOINT
          for v in $(aws ec2 describe-vpcs --filters Name=isDefault,Values=false --query 'Vpcs[].VpcId' --output text); do
            echo "== dependências da $v"
            for r in "describe-security-groups:SecurityGroups[].[GroupId,GroupName]" "describe-network-interfaces:NetworkInterfaces[].[NetworkInterfaceId,Description]" \
                     "describe-subnets:Subnets[].SubnetId" "describe-route-tables:RouteTables[].RouteTableId" "describe-internet-gateways:InternetGateways[].InternetGatewayId" \
                     "describe-vpc-endpoints:VpcEndpoints[].VpcEndpointId" "describe-nat-gateways:NatGateways[].NatGatewayId"; do
              cmd=${r%%:*}; q=${r#*:}; f=vpc-id; [ "$cmd" = describe-internet-gateways ] && f=attachment.vpc-id
              echo "-- $cmd"; aws ec2 $cmd --filters Name=$f,Values=$v --query "$q" --output text || true
            done
          done
