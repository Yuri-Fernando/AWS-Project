# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
# ApplicationSet: uma Application ArgoCD por app do ecossistema (overlay escolhido por TARGET).
# Requer a branch publicada no GitHub (push via @devops). Até lá: kubectl apply -k gitops/overlays/floci.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argus-ecosystem
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - app: argus-api
          - app: retentiq-api
          - app: themis-api
          - app: omnimind-api
          - app: churn-api
          - app: creditscore-app
          - app: riskcredit-train
  template:
    metadata:
      name: "{{.app}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/Yuri-Fernando/Enterprise-Automation.git
        targetRevision: feat/floci-local-platform
        path: "gitops/apps/{{.app}}/overlays/floci"
      destination:
        server: https://kubernetes.default.svc
        namespace: ecosystem
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true]
