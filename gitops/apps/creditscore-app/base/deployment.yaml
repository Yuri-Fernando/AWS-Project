# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditscore-app
  labels: {app.kubernetes.io/name: creditscore-app, app.kubernetes.io/part-of: argus-ecosystem}
  annotations: {argus.dev/source-repo: "Credit-Score-Predictor---AWS-Streamlit"}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: creditscore-app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: creditscore-app, app.kubernetes.io/part-of: argus-ecosystem}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: creditscore-app
          image: creditscore-app
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8501}
          envFrom:
            - configMapRef: {name: platform-env, optional: true}
          env:
            - name: CREDITSCORE_API_URL
              value: "http://creditscore-api.invalid/predict"
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
