# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creditscore-app
  labels: {app.kubernetes.io/name: creditscore-app, app.kubernetes.io/part-of: argus-ecosystem}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: argus
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /_stcore/health
    alb.ingress.kubernetes.io/tags: Project=argus-platform,Environment=lab,ManagedBy=aws-load-balancer-controller
spec:
  ingressClassName: alb
  tls:
    - hosts: [creditscore.argus.lab]
  rules:
    - host: creditscore.argus.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: creditscore-app, port: {number: 80}}}}
