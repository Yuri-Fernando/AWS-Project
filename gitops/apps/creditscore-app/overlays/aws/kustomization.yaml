# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecosystem
resources: [../../base, serviceaccount.yaml]
replicas:
  - {name: creditscore-app, count: 2}
images:
  - name: creditscore-app
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/argus-platform/creditscore-app
    newTag: lab
patches:
  - target: {kind: Deployment, name: creditscore-app}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: creditscore-app
