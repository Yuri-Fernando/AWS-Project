# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retentiq-api
  labels: {app.kubernetes.io/name: retentiq-api, app.kubernetes.io/part-of: argus-ecosystem}
  annotations: {argus.dev/source-repo: "RetentIQ"}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: retentiq-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: retentiq-api, app.kubernetes.io/part-of: argus-ecosystem}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: retentiq-api
          image: retentiq-api
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 4000}
          envFrom:
            - configMapRef: {name: platform-env, optional: true}
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: WEB_ORIGIN
              value: "*"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: retentiq-api-secrets
                  key: JWT_SECRET
                  optional: false
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
