# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimind-api
  labels: {app.kubernetes.io/name: omnimind-api, app.kubernetes.io/part-of: argus-ecosystem}
  annotations: {argus.dev/source-repo: "OmniMind_AI_OS"}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: omnimind-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: omnimind-api, app.kubernetes.io/part-of: argus-ecosystem}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: omnimind-api
          image: omnimind-api
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: platform-env, optional: true}
          env:
            - name: OPENAI_API_KEY
              value: "lab-placeholder-sem-llm"
            - name: OPENAI_BASE_URL
              value: "https://api.openai.com/v1"
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
