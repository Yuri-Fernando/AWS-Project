# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: batch/v1
kind: Job
metadata:
  name: riskcredit-train
  labels: {app.kubernetes.io/name: riskcredit-train, app.kubernetes.io/part-of: argus-ecosystem}
  annotations: {argus.dev/source-repo: "RiskCredit"}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: riskcredit-train}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: riskcredit-train
          image: riskcredit-train
          envFrom:
            - configMapRef: {name: platform-env, optional: true}
          env:
            - name: ARTIFACT_BUCKET
              value: "argus-platform-lab-ml-artifacts"
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1536Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
