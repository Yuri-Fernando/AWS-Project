# GERADO por gitops/gen.py a partir de gitops/apps.json — edite o spec, não este arquivo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecosystem
resources: [../../base, serviceaccount.yaml]
replicas:
  - {name: argus-api, count: 2}
images:
  - name: argus-api
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/argus-platform/argus-api
    newTag: lab
patches:
  - target: {kind: Deployment, name: argus-api}
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: argus-api
